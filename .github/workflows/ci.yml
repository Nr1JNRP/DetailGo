name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Formatacao
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependencias
        run: npm ci

      - name: Verifica formatacao
        run: npm run format:check

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependencias
        run: npm ci

      - name: Verifica tipos
        run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependencias
        run: npm ci

      - name: Executa lint
        run: npm run lint

  tests:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependencias
        run: npm ci

      # Roda com cobertura: mostra o número em toda PR e aplica o ratchet
      # (coverageThreshold) — o job falha se a cobertura regredir.
      - name: Executa testes com cobertura
        run: npm run test:cov -- --runInBand --watchAll=false

  functions-tests:
    name: Testes das Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instala dependencias das functions
        working-directory: functions
        run: npm ci

      - name: Executa testes das functions
        working-directory: functions
        run: npm test

  rules-tests:
    name: Testes das regras Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # O emulador do Firestore exige Java 21+ (firebase-tools 15+).
      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instala dependencias
        run: npm ci

      - name: Instala firebase-tools
        run: npm i -g firebase-tools@15.7.0

      - name: Executa testes das regras
        run: npm run test:rules

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Substitui o "cache: gradle" do setup-java. Aquele so restaura
      # dependencias e, com a chave inalterada, nunca regrava o cache; este
      # guarda tambem o build cache de tarefas entre execucoes. So a main
      # escreve: PR nao envenena o cache que todo mundo usa.
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # O C++ gerado pelo codegen do React Native e o item mais caro do build,
      # e ele e recompilado por ABI. A chave e o que determina esse C++:
      # dependencias, versao do NDK e configuracao do Gradle.
      - name: Cache do build nativo
        uses: actions/cache@v4
        with:
          path: |
            android/app/.cxx
            android/app/build/intermediates/cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Instala dependencias
        run: npm ci

      - name: Prepara google-services.json temporario
        shell: bash
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "detailgo-ci",
              "storage_bucket": "detailgo-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.jnrpalma.detailgo"
                  }
                },
                "api_key": [
                  {
                    "current_key": "ci-placeholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Prepara debug keystore temporaria
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Uma ABI so. Este job responde "o app ainda compila?", e o C++ aqui vem
      # todo do codegen do React Native — nao ha codigo nosso que possa quebrar
      # em uma arquitetura e passar em outra. As quatro ABIs continuam no
      # android-apk.yml, que e quem gera APK para instalar.
      - name: Gera build Android debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache \
            -PreactNativeArchitectures=arm64-v8a

  secrets:
    name: Verifica arquivos sensiveis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Bloqueia arquivos sensiveis versionados
        shell: bash
        run: |
          blocked_regex='(^|/)(\.env(\..*)?|google-services\.json|GoogleService-Info\.plist|serviceAccountKey\.json|.*service-account.*\.json|.*credentials.*\.json|.*\.(jks|keystore|pem|p12|key|cer|der))$'
          found="$(git ls-files | grep -Ei "$blocked_regex" || true)"

          if [ -n "$found" ]; then
            echo "Arquivos sensiveis encontrados no Git:"
            echo "$found"
            exit 1
          fi

          if git grep -n -E '-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----' -- . ':!package-lock.json'; then
            echo "Possivel chave privada encontrada no codigo."
            exit 1
          fi

  commit-lint:
    name: Valida mensagens de commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependencias
        run: npm ci

      # Commits de bot (Renovate) sao auto-gerados como "chore(deps): ..." e nao
      # seguem o enum de tipos do projeto. A convecao vale so para commits humanos.
      - name: Valida commits do PR
        if: ${{ !contains(github.event.pull_request.user.login, 'renovate') }}
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
